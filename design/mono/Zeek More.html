document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

uard the prize. Any two must sign each payout. Each one checks every payout against the rules on its own, and refuses anything wrong. If one is offline, payouts still work.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n            <sc-for list=\"{{ keyholders }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"border:3px {{ k.border }} #FFFFFF;padding:20px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\"><zk-icon name=\"key\" size=\"34\"><\u002Fzk-icon><span style=\"font-size:12px;font-weight:800;letter-spacing:.12em;padding:4px 10px;background:{{ k.bg }};color:{{ k.fg }};border:2.5px solid #FFFFFF;display:flex;gap:6px;align-items:center\"><zk-icon name=\"{{ k.sicon }}\" size=\"14\" stroke=\"2.6\"><\u002Fzk-icon>{{ k.status }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:clamp(22px,2cqw,28px);font-weight:900;font-stretch:112%\">{{ k.name }}<\u002Fspan>\n                <span style=\"font-size:15px;color:#D6D6D6\">{{ k.who }}<\u002Fspan>\n                <span style=\"font-size:14px;color:#A6A6A6;font-family:'JetBrains Mono'\">{{ k.stat }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;font-size:16px;border:1.5px dashed #6B6B6B;padding:14px 16px;color:#D6D6D6\"><zk-icon name=\"arrow\" size=\"20\"><\u002Fzk-icon><span><strong style=\"color:#FFFFFF\">Today<\u002Fstrong> all three are run by the Zeek team. <strong style=\"color:#FFFFFF\">Next:<\u002Fstrong> independent operators.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px\">\n            <div style=\"border:3px solid #FFFFFF;display:flex;flex-direction:column\">\n              <div style=\"padding:14px 16px;border-bottom:3px solid #FFFFFF;font-size:19px;font-weight:800;display:flex;gap:10px;align-items:center\"><zk-icon name=\"shield\" size=\"22\"><\u002Fzk-icon>Refused payouts<\u002Fdiv>\n              <div style=\"padding:16px;display:flex;gap:14px;align-items:flex-start\"><div style=\"width:38px;height:38px;flex:none;border:3px dashed #FFFFFF;display:flex;align-items:center;justify-content:center\"><zk-icon name=\"x\" size=\"20\" stroke=\"3.2\"><\u002Fzk-icon><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:800\">Round 17<\u002Fspan><span style=\"font-size:16px;color:#D6D6D6;line-height:1.45\">A payout to the wrong address. Refused by all 3 keyholders.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:3px solid #FFFFFF;display:flex;flex-direction:column\">\n              <div style=\"padding:14px 16px;border-bottom:3px solid #FFFFFF;font-size:19px;font-weight:800;display:flex;gap:10px;align-items:center\"><zk-icon name=\"vault\" size=\"22\"><\u002Fzk-icon>The vault<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1.5px solid #3A3A3A\"><span style=\"display:flex;gap:10px;align-items:center;font-size:16px\"><zk-icon name=\"mine\" size=\"20\"><\u002Fzk-icon>Deep Cache<\u002Fspan><span style=\"font-size:28px;font-weight:900;font-stretch:112%\">18.42<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1.5px solid #3A3A3A\"><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"display:flex;gap:10px;align-items:center;font-size:16px\"><zk-icon name=\"coin\" size=\"20\"><\u002Fzk-icon>Operator float<\u002Fspan><span style=\"font-size:13px;color:#A6A6A6;padding-left:30px\">pays network fees and refunds<\u002Fspan><\u002Fspan><span style=\"font-size:28px;font-weight:900;font-stretch:112%\">3.00<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 16px\"><span style=\"display:flex;gap:10px;align-items:center;font-size:16px\"><zk-icon name=\"chest\" size=\"20\"><\u002Fzk-icon>This round’s prize<\u002Fspan><span style=\"color:#E8B54A;font-size:28px;font-weight:900;font-stretch:112%\">1.284<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:3px solid #FFFFFF;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;gap:10px;align-items:center;font-size:19px;font-weight:800\"><zk-icon name=\"eye\" size=\"22\"><\u002Fzk-icon>Public viewing key<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;color:#D6D6D6;line-height:1.5;max-width:760px\">With this key anyone can watch every dig come in and every payout go out. It can only look; it can’t spend, and it doesn’t show who sent anything.<\u002Fp>\n            <div style=\"display:flex;gap:10px;align-items:stretch;flex-wrap:wrap\"><div style=\"flex:1;min-width:0;border:1.5px solid #6B6B6B;padding:12px;font-family:'JetBrains Mono';font-size:13px;color:#D6D6D6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">uviewtest1w4k0…f8q2m7c3d9x0z5n2h6<\u002Fdiv><div style=\"height:46px;border:3px solid #FFFFFF;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;font-weight:800\"><zk-icon name=\"copy\" size=\"18\"><\u002Fzk-icon>Copy<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 12. CAMPFIRE ============ -->\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n  <div style=\"display:flex;gap:20px;align-items:baseline\"><span style=\"font-size:20px;font-weight:800;border:3px solid #FFFFFF;padding:2px 10px\">12<\u002Fspan><h2 style=\"margin:0;font-size:44px;font-weight:900;font-stretch:112%\">Campfire<\u002Fh2><span style=\"font-size:18px;color:#A6A6A6\">Anonymous chat that lives on the chain. Messages ride on a dig, or on a shout (0.0005 ZEC → Deep Cache).<\u002Fspan><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start\">\n  <sc-for list=\"{{ sizes }}\" as=\"sz\" hint-placeholder-count=\"2\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:16px;font-weight:700;color:#A6A6A6;letter-spacing:.06em\">12 · {{ sz.label }}<\u002Fdiv>\n      <div style=\"width:{{ sz.w }}px;min-height:{{ sz.h }}px;background:#0D0D0D;outline:1.5px solid #3A3A3A;container-type:inline-size;display:flex;flex-direction:column\">\n        <div style=\"height:clamp(60px,5.5cqw,80px);border-bottom:3px solid #FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,2.8cqw,40px)\">\n          <div style=\"display:flex;gap:14px;align-items:center;font-size:18px;font-weight:800\"><zk-icon name=\"back\" size=\"22\"><\u002Fzk-icon><zk-icon name=\"fire\" size=\"22\"><\u002Fzk-icon>Campfire<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700\"><div style=\"width:40px;height:24px;border:3px solid #FFFFFF;padding:2px;display:flex;justify-content:flex-end\"><div style=\"width:14px;height:14px;background:#FFFFFF\"><\u002Fdiv><\u002Fdiv>Filter<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:100%;max-width:1200px;margin:0 auto;padding:clamp(16px,3cqw,40px) clamp(16px,2.8cqw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(16px,3cqw,40px);align-items:start;flex:1\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <zk-campfire style=\"width:100%;max-width:560px\"><\u002Fzk-campfire>\n            <div style=\"font-size:15px;color:#A6A6A6;line-height:1.5\">Each message shows only its round, tile (or Shout), time and text. A nickname appears only if the sender typed one.<\u002Fdiv>\n            <div style=\"border:1.5px dashed #3A3A3A;padding:16px;display:flex;gap:14px;align-items:center\"><zk-icon name=\"fire\" size=\"32\"><\u002Fzk-icon><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;color:#A6A6A6\">EMPTY STATE<\u002Fspan><span style=\"font-size:19px;font-weight:800\">Quiet tonight<\u002Fspan><span style=\"font-size:14px;color:#D6D6D6\">Be the first to say something.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;flex-direction:column;border:3px solid #FFFFFF\">\n              <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"6\">\n                <div style=\"padding:14px 16px;border-bottom:1.5px solid #3A3A3A;display:flex;flex-direction:column;gap:6px;color:{{ m.color }}\">\n                  <div style=\"display:flex;gap:10px;font-family:'JetBrains Mono';font-size:12px;color:#A6A6A6;align-items:center\"><span>{{ m.round }}<\u002Fspan><span style=\"color:{{ m.tagColor }};font-weight:600\">{{ m.tile }}<\u002Fspan><span>{{ m.time }}<\u002Fspan><span>{{ m.nick }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:17px;line-height:1.4;display:flex;gap:10px;align-items:center\"><zk-icon name=\"{{ m.icon }}\" size=\"{{ m.iconSize }}\"><\u002Fzk-icon>{{ m.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:3px solid #FFFFFF;padding:14px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"min-height:52px;border:1.5px solid #6B6B6B;padding:12px;font-size:17px;color:#A6A6A6\">Say something… (140 letters)<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;border:3px solid #FFFFFF\"><div style=\"height:46px;background:#FFFFFF;color:#0A0A0A;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800\"><zk-icon name=\"shovel\" size=\"18\"><\u002Fzk-icon>With my next dig<\u002Fdiv><div style=\"height:46px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800\"><zk-icon name=\"shout\" size=\"18\"><\u002Fzk-icon>Shout · 0.0005<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span style=\"font-size:14px;color:#A6A6A6\">Nickname (optional)<\u002Fspan><div style=\"height:52px;padding:0 22px;background:#FFFFFF;color:#0A0A0A;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900\"><zk-icon name=\"send\" size=\"18\" stroke=\"2.6\"><\u002Fzk-icon>Send<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const W = '#FFFFFF', K = '#0A0A0A';\n    const status = s => s === 'PAID' ? { border: 'solid', badgeBg: W, badgeFg: K } : s === 'REFUNDED' ? { border: 'solid', badgeBg: 'transparent', badgeFg: W } : { border: 'dashed', badgeBg: 'transparent', badgeFg: W };\n    const rounds = [\n      ['Round 411', 'Tile 9', '1.120', 'PAID'], ['Round 410', 'Tile 22', '0.964', 'PAID'], ['Round 409', 'Tile 4', '0.410', 'REFUNDED'],\n      ['Round 408', 'Tile 13', '1.388', 'PAID'], ['Round 407', '—', '0.722', 'VOIDED'], ['Round 406', 'Tile 17', '0.851', 'PAID']\n    ].map(([round, tile, pot, s], i) => ({ round, tile, pot, status: s, bg: i === 0 ? '#1C1C1C' : 'transparent', ...status(s) }));\n    const amts = [0.02, 0.06, 0, 0.01, 0.11, 0, 0.05, 0.02, 0.21, 0.03, 0, 0.01, 0.06, 0, 0.02, 0.05, 0.02, 0, 0.01, 0.12, 0, 0, 0.02, 0.06, 0.03];\n    const perTile = amts.map((v, i) => ({ n: i + 1, v: v ? v.toFixed(2) : '0', bg: i === 8 ? W : 'transparent', fg: i === 8 ? K : (v ? W : '#6B6B6B') }));\n    const pass = (icon, title, text) => ({ icon, title, text, color: W, sub: '#D6D6D6', mark: 'check', boxBorder: W, boxBg: W, radius: '0', spinGap: W, anim: 'none' });\n    const checks = [\n      pass('dice', 'The draw is genuine', 'Tile 9 came from a public random beacon at block 2,914,880, published after the round closed.'),\n      pass('chain', 'Every dig is on the chain', 'All 31 dug tiles match payments seen with the public viewing key.'),\n      pass('clock', 'No late digs', 'Nothing that arrived after 20:52 was counted. 1 late payment was refunded.'),\n      { icon: 'math', title: 'The math matches', text: 'Adding up tile 9’s shares…', color: W, sub: '#D6D6D6', mark: 'tile', boxBorder: W, boxBg: 'transparent', radius: '50%', spinGap: 'transparent', anim: 'zkspin 1s linear infinite' },\n      { icon: 'split', title: 'The payout matches', text: 'Waiting for the step above.', color: '#A6A6A6', sub: '#A6A6A6', mark: 'tile', boxBorder: '#6B6B6B', boxBg: 'transparent', radius: '0', spinGap: '#6B6B6B', anim: 'none' }\n    ];\n    checks[3].mark = 'minus'; checks[4].mark = 'minus';\n    const wl = 'ocean tribe lamp velvet arch cradle mango oxygen silent fringe hollow drift basket clever ember guitar planet wisdom harbor raven tiny meadow orbit sketch'.split(' ');\n    return {\n      sizes: [{ w: 1440, h: 900, label: 'DESKTOP 1440' }, { w: 390, h: 844, label: 'MOBILE 390' }],\n      rounds, perTile,\n      payouts: [{ share: '38% of tile 9', amt: '0.40432' }, { share: '29% of tile 9', amt: '0.30856' }, { share: '24% of tile 9', amt: '0.25536' }, { share: '9% of tile 9', amt: '0.09576' }],\n      checks,\n      words: wl.map((w, i) => ({ n: i + 1, w })),\n      history: [\n        { icon: 'chest', memo: 'Zeek round 16: treasure', time: 'Today 21:07', amt: '+0.412' },\n        { icon: 'shovel', memo: 'Zeek round 412: dig · 3 tiles', time: 'Today 20:48', amt: '−0.15015' },\n        { icon: 'shout', memo: 'Zeek campfire: shout', time: 'Today 20:31', amt: '−0.0005' },\n        { icon: 'down2', memo: 'Added', time: 'Yesterday', amt: '+2.50' }\n      ],\n      keyholders: [\n        { name: 'Keyholder A', who: 'Run by the Zeek team', status: 'ONLINE', sicon: 'check', bg: W, fg: K, border: 'solid', stat: 'checked 412 · refused 1' },\n        { name: 'Keyholder B', who: 'Run by the Zeek team', status: 'ONLINE', sicon: 'check', bg: W, fg: K, border: 'solid', stat: 'checked 412 · refused 1' },\n        { name: 'Keyholder C', who: 'Run by the Zeek team', status: 'OFFLINE', sicon: 'offline', bg: 'transparent', fg: W, border: 'dashed', stat: 'last seen 2 h ago · payouts still work' }\n      ],\n      messages: [\n        { round: 'R412', tile: 'TILE 7', time: '21:04', nick: '', text: 'the middle row feels lucky tonight', color: W, tagColor: W, icon: 'chat', iconSize: '0' },\n        { round: 'R412', tile: 'SHOUT', time: '21:05', nick: '· moth', text: 'hello from the dark', color: W, tagColor: W, icon: 'chat', iconSize: '0' },\n        { round: 'R411', tile: 'TILE 9', time: '20:51', nick: '', text: 'last second dig. wish me luck', color: W, tagColor: W, icon: 'chat', iconSize: '0' },\n        { round: 'R411', tile: 'TILE 2', time: '20:50', nick: '', text: 'Hidden. Tap to show', color: '#A6A6A6', tagColor: '#A6A6A6', icon: 'eye', iconSize: '20' },\n        { round: 'R412', tile: 'SHOUT', time: 'now', nick: '', text: 'On its way · about 25 s', color: '#A6A6A6', tagColor: '#A6A6A6', icon: 'clock', iconSize: '20' }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
