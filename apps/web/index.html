<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta
      name="description"
      content="Zeek: a treasure hunt on Zcash. Everyone sees the field. No one sees you."
    />
    <title>Zeek</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Load screen: painted before the JS bundle (src/boot.ts moves its bar and
      removes it). Inline CSS only: the site's CSP allows no inline script, so
      a CSS animation also hides it at 4 s if the bundle never runs.
    -->
    <style>
      #zeek-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0a0a0a;
        animation: zb-cap 350ms ease-out 4000ms forwards;
      }
      #zeek-boot.zb-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 350ms ease-out;
      }
      #zeek-boot svg {
        display: block;
        width: 140px;
        height: auto;
        overflow: visible;
      }
      @media (max-width: 599px) {
        #zeek-boot svg {
          width: 104px;
        }
      }
      #zeek-boot .zb-outer {
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        fill-opacity: 0;
        animation:
          zb-draw 600ms ease-out forwards,
          zb-fill 250ms ease-out 550ms forwards;
      }
      #zeek-boot .zb-inner {
        opacity: 0;
        animation: zb-fade 250ms ease-out 650ms forwards;
      }
      #zeek-boot .zb-track {
        width: 160px;
        height: 2px;
        overflow: hidden;
        background: #2a2a2a;
      }
      #zeek-boot .zb-bar {
        width: 0;
        height: 100%;
        background: #e8b54a;
        transition: width 400ms cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      @keyframes zb-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes zb-fill {
        to {
          fill-opacity: 1;
        }
      }
      @keyframes zb-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes zb-cap {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #zeek-boot .zb-outer {
          animation: none;
          stroke-dashoffset: 0;
          fill-opacity: 1;
        }
        #zeek-boot .zb-inner {
          animation: none;
          opacity: 1;
        }
        #zeek-boot .zb-bar,
        #zeek-boot.zb-out {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="zeek-boot" role="status" aria-label="Loading Zeek" data-testid="load-screen">
      <svg viewBox="128 282 483 358" aria-hidden="true">
        <path
          class="zb-outer"
          d="M220 297L512 297L596 380L530 460L596 527L516 625L220 625L143 527L205 460L143 378Z"
          fill="#ECEBE6"
          stroke="#ECEBE6"
          stroke-width="14"
          stroke-linejoin="round"
        />
        <g class="zb-inner">
          <path
            d="M176 371L231 316L488 316L222 595L163 537L303 392Q309 371 290 371Z M468 525L517 476L562 525Z"
            fill="#0A0A0A"
            stroke="#0A0A0A"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <!-- prettier-ignore -->
          <text transform="translate(517.6 606) skewX(-43.63)" text-anchor="end" font-family="Archivo Black, Archivo Variable, Archivo, sans-serif" font-weight="900" font-size="60" letter-spacing="-2" fill="#0A0A0A">eek</text>
        </g>
      </svg>
      <div class="zb-track" aria-hidden="true"><div class="zb-bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
