[package]
name = "zeek-pocket"
version = "0.1.0"
description = "Zeek Pocket: a shielded Zcash testnet wallet for the browser (Rust compiled to WebAssembly)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
zeek-core = { path = "../zeek-core" }

orchard.workspace = true
pasta_curves.workspace = true
pczt.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
incrementalmerkletree = "0.8.2"
shardtree = "0.7"
zcash_note_encryption = "0.4.1"
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true

wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1.3.0"
rayon = { version = "1.10", features = ["web_spin_lock"] }
# rand_core 0.6 / halo2 draw randomness through getrandom 0.2, which needs the
# JavaScript backend on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[features]
# Loads the rayon worker threads without a bundler (the standalone benchmark
# page). The Vite build of packages/zeek-pocket leaves this off.
no-bundler = ["wasm-bindgen-rayon/no-bundler"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
