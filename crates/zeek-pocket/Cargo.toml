[package]
name = "zeek-pocket"
version = "0.1.0"
description = "Zeek Pocket: a shielded Zcash testnet wallet for the browser (Rust compiled to WebAssembly)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
zeek-core = { path = "../zeek-core" }

orchard.workspace = true
pasta_curves.workspace = true
pczt.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_address.workspace = true
zip32.workspace = true
# Compact-block scanning and shard serialization only: no gRPC, no sqlite.
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard", "unstable-serialization"] }
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard"] }
zcash_note_encryption = "0.4.1"
incrementalmerkletree = "0.8.2"
shardtree = "0.7"
prost = "0.14"

# Wallet secrets: BIP 39 phrase, Argon2id + XChaCha20-Poly1305 envelopes.
bip39 = { version = "2.2", default-features = false, features = ["std"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
sha2 = "0.10"
zeroize = { workspace = true, features = ["zeroize_derive"] }
rand_core.workspace = true
# zeek-core's sealing takes a rand_core 0.9 RNG; seeded from the OS RNG.
rand_chacha_09 = { package = "rand_chacha", version = "0.9.0", default-features = false }

serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true }
thiserror.workspace = true
hex.workspace = true

wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1.3.0"
rayon = { version = "1.10", features = ["web_spin_lock"] }
# rand_core 0.6 and halo2 draw randomness through getrandom 0.2, which needs
# the JavaScript (Web Crypto) backend on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
zeek-engine = { path = "../zeek-engine", features = ["testkit"] }
tokio = { workspace = true, features = ["rt", "macros"] }
zip321.workspace = true

[features]
# Loads the rayon worker threads without a bundler (the standalone benchmark
# page). The Vite build of packages/zeek-pocket leaves this off.
no-bundler = ["wasm-bindgen-rayon/no-bundler"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
