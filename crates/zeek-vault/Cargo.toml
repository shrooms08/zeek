[package]
name = "zeek-vault"
version = "0.1.0"
description = "2-of-3 FROST threshold vault controlling a Zcash Orchard address (testnet spike)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zeek-vault"
path = "src/bin/zeek-vault.rs"

[dependencies]
frost-core.workspace = true
frost-rerandomized.workspace = true
reddsa.workspace = true

orchard.workspace = true
pasta_curves.workspace = true
pczt.workspace = true
zcash_address.workspace = true
zcash_client_backend.workspace = true
zcash_client_sqlite.workspace = true
zcash_keys.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zip321.workspace = true

group.workspace = true
ff.workspace = true
rand_core.workspace = true
zeroize.workspace = true
secrecy.workspace = true
rusqlite.workspace = true

tonic.workspace = true
tokio.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
incrementalmerkletree = "0.8.2"
shardtree = "0.7"
zcash_note_encryption = "0.4.1"
zcash_primitives = { version = "0.30.1", features = ["test-dependencies"] }
zcash_protocol = { version = "0.10.5", features = ["local-consensus"] }

# The pinned librustzcash crates gate NU7 behind this cfg (set in .cargo/config.toml);
# tests must name the `LocalNetwork::nu7` field it adds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
